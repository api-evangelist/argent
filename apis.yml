aid: argent
name: Argent
description: >-
  Argent (rebranded to Ready, ready.co, in 2025) is a self-custodial smart-contract
  wallet company focused on Starknet and Ethereum. It builds account-abstraction
  wallets - the Ready / Argent X browser extension and mobile app, a seedless email
  and password Web Wallet, and a multisig - plus the open-source developer tooling
  dapps use to integrate them: the starknetkit connection SDK, session keys
  (@argent/x-sessions), multicall batching, get-starknet, and the Swift starknet.swift
  and web3.swift libraries. Argent ships no first-party REST API; integration is via
  these client SDKs and on-chain smart contracts, with developer documentation hosted
  at docs.ready.co. Surfaced as an index-ventures portfolio company and enriched here.
